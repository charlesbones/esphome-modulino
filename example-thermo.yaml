# Minimal starter: a single Modulino Thermo node on an Arduino Nano ESP32.
esphome:
  name: modulino-thermo
  friendly_name: Modulino Thermo

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: arduino

# Pull in the Modulino components from this repo.
external_components:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Home Assistant native API (auto-discovers the entities below).
api:

ota:
  - platform: esphome

logger:

sensor:
  - platform: modulino_thermo
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
